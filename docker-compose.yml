services:
  mongo:
    image: mongo:latest
    container_name: mongodb_node
    restart: always
    ports:
      - "27017:27017"
    environment: 
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    entrypoint:
      - bash
      - -c
      - openssl rand -base64 756 > /data/keyfile && chmod 400 /data/keyfile && chown mongodb:mongodb /data/keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/keyfile
    volumes:
      - opsdesk-mongodbdata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10
  
  mongo-init:
    image: mongo:latest
    container_name: mongodb_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: [ "mongosh", "--host", "mongo:27017", "-u", "admin", "-p", "password123", "--authenticationDatabase", "admin", "--eval", "rs.initiate({ _id: 'rs0', members: [ { _id: 0, host: 'localhost:27017' } ] })" ]

  redis:
    image: redis:7.4-alpine
    container_name: redis_node
    restart: always
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  opsdesk-mongodbdata:
  redis-data:
    driver: local
